[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electrical-telemetry-platform"
version = "0.1.0"
description = "Plataforma local de telemetria electrica con FinOps (Python, PostgreSQL/TimescaleDB, Redpanda, MinIO)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "psycopg2-binary>=2.9.10",
    "confluent-kafka>=2.5",
    "polars>=1.21",
    "pandas>=2.2",
    "minio>=7.2",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
industrial = ["pymodbus", "asyncua"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
